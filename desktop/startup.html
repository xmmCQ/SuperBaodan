<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>超级宝蛋</title>
  <style>
    :root { color-scheme: light; font-family: "Microsoft YaHei UI", "Segoe UI", sans-serif; background: #f4efe8; color: #312b25; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at 50% 30%, #fffaf2 0, #f4efe8 58%, #e9e1d7 100%); }
    main { width: min(520px, calc(100vw - 64px)); padding: 42px; text-align: center; border: 1px solid rgba(84,64,46,.12); border-radius: 24px; background: rgba(255,255,255,.78); box-shadow: 0 24px 70px rgba(71,54,37,.12); }
    img { width: 86px; height: 86px; border-radius: 24px; }
    h1 { margin: 18px 0 8px; font-size: 26px; }
    p { min-height: 24px; margin: 0; color: #776b60; line-height: 1.7; }
    .spinner { width: 28px; height: 28px; margin: 24px auto 0; border: 3px solid #ddd2c7; border-top-color: #9b6842; border-radius: 50%; animation: spin .8s linear infinite; }
    .actions { display: none; gap: 10px; justify-content: center; margin-top: 24px; }
    button { border: 0; border-radius: 10px; padding: 10px 18px; cursor: pointer; font: inherit; background: #ede5dc; color: #41382f; }
    button.primary { background: #8c5f3d; color: white; }
    body.error .spinner { display: none; } body.error .actions { display: flex; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <main>
    <img src="../public/baodan-avatar.png" alt="宝蛋">
    <h1>超级宝蛋</h1>
    <p id="message">正在启动工作台……</p>
    <div class="spinner" aria-hidden="true"></div>
    <div class="actions">
      <button id="logs" type="button">查看日志</button>
      <button id="exit" type="button">退出</button>
      <button id="retry" class="primary" type="button">重试</button>
    </div>
  </main>
  <script src="startup.js"></script>
</body>
</html>
